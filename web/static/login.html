<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Satellite Data</title>
  <link rel="stylesheet" href="/styles.css?v=30">
</head>
<body class="login">
    <form id="portal-login-form" class="login-card" action="/login" method="post">
      <div class="brand">Satellite Data</div>
      <input id="portal-username" name="username" autocomplete="username" placeholder="username" aria-label="username" maxlength="64" required autofocus>
      <input id="portal-password" name="password" type="password" autocomplete="current-password" placeholder="password" aria-label="password" required>
      <div id="portal-login-error" class="form-error" role="alert"></div>
      <button id="portal-login-submit" type="submit">Sign in</button>
    </form>
  <script type="module" src="/login.js?v=1"></script>
</body>
</html>
