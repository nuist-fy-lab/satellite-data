name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check web JavaScript syntax
        run: node --check web/static/app.js
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build daemon and CLI
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/satellited ./cmd/satellited
          go build -trimpath -ldflags='-s -w' -o dist/satellite ./cmd/satellite
      - name: Record cloud build digests
        run: |
          cd dist
          sha256sum satellite satellited > SHA256SUMS
      - name: Store short-lived cloud binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: satellite-release
          path: |
            dist/satellite
            dist/satellited
            dist/SHA256SUMS
          retention-days: 2
          if-no-files-found: error
      - name: Publish rolling CI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish-ci-release.sh
