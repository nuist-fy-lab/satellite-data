name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: satellite_test
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d satellite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify lossless PostgreSQL indexing and idempotent batch submission
        env:
          SATELLITE_TEST_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=postgres password=ci-disposable-password dbname=satellite_test sslmode=disable"
        run: go test ./internal/state -run '^TestPostgresCompactStateRoundTrip$' -count=1 -v
      - name: Check migration tool parses on Python 3.6
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace python:3.6.15-slim python3 -c "import ast; [ast.parse(open(p).read()) for p in ['deploy/migrate-satellite-state.py', 'deploy/plan-normalization.py', 'deploy/prepare-satellite-copy.py', 'deploy/migrate-satellite-bulk-shadow.py']]"
      - name: Verify complete SQLite to PostgreSQL import, normalization and reconciliation
        env:
          PGUSER: postgres
          PGPASSWORD: ci-disposable-password
        run: |
          createdb -h 127.0.0.1 satellite_migration_test
          SATELLITED_POSTGRES_DSN="host=127.0.0.1 port=5432 user=postgres password=ci-disposable-password dbname=satellite_migration_test sslmode=disable" \
            go run ./cmd/satellited -init-state-only
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('/tmp/satellite-migration-fixture.sqlite3')
          db.executescript("""
          CREATE TABLE official_slots(product_key TEXT,slot_ts TEXT,granule_id TEXT,
           asset_count INTEGER,total_size INTEGER,representative_filename TEXT,refreshed_at TEXT);
          CREATE TABLE official_assets(product_key TEXT,slot_ts TEXT,granule_id TEXT,
           filename TEXT,url TEXT,size INTEGER,etag TEXT,media_type TEXT);
          """)
          db.executemany("INSERT INTO official_slots VALUES (?,?,?,?,?,?,?)", [
              ('modis:C1','2006-07-23T21:45:00Z','g1',3,1099511627783,'a.hdf','2026-10-20T01:00:00Z'),
              ('modis:C1','2006-07-23T21:50:00Z','g2',0,0,'','2026-10-20T01:00:00Z'),
              ('modis:管道|特殊','2006-07-24T00:00:00Z','g3',1,5,'other.hdf','2026-10-20T01:00:00Z')])
          db.executemany("INSERT INTO official_assets VALUES (?,?,?,?,?,?,?,?)", [
              ('modis:C1','2006-07-23T21:45:00Z','g1','a.hdf','https://cdn.example.org/same/a.hdf',1099511627776,'','hdf'),
              ('modis:C1','2006-07-23T21:45:00Z','g1','b.hdf','https://cdn.example.org/same/b.hdf',6,'etag','hdf'),
              ('modis:C1','2006-07-23T21:45:00Z','g1','c.hdf','https://cdn.example.org/same/wrong-file.hdf?token=a',1,'','hdf'),
              ('modis:C1','2006-07-23T22:00:00Z','asset-only','测试.hdf','',0,'',''),
              ('modis:管道|特殊','2006-07-24T00:00:00Z','g3','other.hdf','https://cdn.example.org/ü/other.hdf',5,'','hdf')])
          # Multiple independent days share URL prefixes; concurrent
          # transactions must not deadlock or lose any granule/file fields.
          from datetime import datetime, timedelta
          for day in range(8):
              stamp = (datetime(2006,7,25)+timedelta(days=day)).strftime('%Y-%m-%d')+'T08:00:00Z'
              db.execute("INSERT INTO official_slots VALUES (?,?,?,?,?,?,?)",
                         ('concurrent:modis',stamp,'g'+str(day),1,11,'shared.hdf','2026-10-20T01:00:00Z'))
              db.execute("INSERT INTO official_assets VALUES (?,?,?,?,?,?,?,?)",
                         ('concurrent:modis',stamp,'g'+str(day),'shared.hdf',
                          'https://cdn.example.org/same/shared.hdf',11,'','hdf'))
          db.commit()
          db.close()
          PY
          python3 deploy/migrate-satellite-state.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --stage import
          python3 deploy/plan-normalization.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --output /tmp/satellite-migration-plan.tsv --workers 4
          test "$(wc -l </tmp/satellite-migration-plan.tsv)" = "10"
          python3 deploy/prepare-satellite-copy.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --worklist /tmp/satellite-migration-plan.tsv --output-dir /tmp/satellite-prepared-copy --workers 4
          # Repeated preparation must reuse validated shards without changing data.
          python3 deploy/prepare-satellite-copy.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --worklist /tmp/satellite-migration-plan.tsv --output-dir /tmp/satellite-prepared-copy --workers 4
          test "$(find /tmp/satellite-prepared-copy -name '*.json' | wc -l)" = "10"
          python3 deploy/migrate-satellite-state.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --stage normalize --workers 4 --worklist /tmp/satellite-migration-plan.tsv --prepared-dir /tmp/satellite-prepared-copy
          python3 deploy/migrate-satellite-state.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --stage verify
          # Normalization and reconciliation must be restart-safe.
          python3 deploy/migrate-satellite-state.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --stage normalize --workers 4
          python3 deploy/migrate-satellite-state.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --stage verify
          # The two canonical URL suffixes are represented by SQL NULL.
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM pg_official_asset_details WHERE url_suffix IS NULL')" = "11"
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM migration_verified_days')" = "10"
      - name: Verify index-after-COPY shadow migration and atomic swap
        env:
          PGUSER: postgres
          PGPASSWORD: ci-disposable-password
        run: |
          export SHADOW="python3 deploy/migrate-satellite-bulk-shadow.py --sqlite /tmp/satellite-migration-fixture.sqlite3 --database satellite_migration_test --socket 127.0.0.1 --worklist /tmp/satellite-migration-plan.tsv --prepared-dir /tmp/satellite-prepared-copy --workers 3 --chunk-days 4"
          $SHADOW --stage init
          $SHADOW --stage load
          # Repeat the load; committed per-day checkpoints must prevent duplicates.
          $SHADOW --stage load
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM migration_bulk_loaded_days')" = "10"
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM migration_bulk_assets')" = "13"
          $SHADOW --stage build
          $SHADOW --stage build
          $SHADOW --stage verify
          $SHADOW --stage verify
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM migration_bulk_verified_days')" = "10"
          $SHADOW --stage cutover
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM official_assets')" = "13"
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM official_slots')" = "11"
          test "$(psql -h 127.0.0.1 -d satellite_migration_test -Atc 'SELECT count(*) FROM pg_official_asset_details_pre_bulk')" = "13"
          psql -h 127.0.0.1 -d satellite_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          -- Both directions of the complete post-cutover relation must match.
          DO $$
          BEGIN
            IF EXISTS (SELECT * FROM migration_official_assets EXCEPT ALL SELECT * FROM official_assets)
            OR EXISTS (SELECT * FROM official_assets EXCEPT ALL SELECT * FROM migration_official_assets)
            OR EXISTS (SELECT * FROM migration_official_slots EXCEPT ALL SELECT * FROM official_slots)
            OR EXISTS (SELECT * FROM official_slots EXCEPT ALL SELECT * FROM migration_official_slots)
            THEN RAISE EXCEPTION 'post-swap source/target field mismatch'; END IF;
          END $$;
          -- The new identity sequence must not collide with restored keys.
          INSERT INTO pg_official_granule_keys(product_key,slot_ts,granule_id)
          VALUES('new','2000-01-01T00:00:00Z','fresh');
          INSERT INTO pg_official_url_prefixes(prefix) VALUES('https://fresh.example/');
          SQL
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check web JavaScript syntax
        run: |
          node --check web/static/app.js
          node --check web/static/login.js
          node --check web/static/catalog.js
          node --check web/static/era5-inventory.js
          node --check web/visual-check.mjs
      - name: Test request controls and timezones without a browser
        run: node --test web/era5.test.mjs web/download-timezones.test.mjs web/calendar-index.test.mjs web/catalog-inventory.test.mjs
      - name: Test historical EarthCARE verification controls
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Check historical verifier on production Python 3.6
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace python:3.6.15-slim python3 -m unittest discover -s deploy/tests -p 'test_verify_earthcare_archive.py'
      - name: Verify EarthCARE user units
        run: systemd-analyze verify deploy/systemd/earthcare-verification.service deploy/systemd/earthcare-verification.timer
      - name: Validate portal styles and HTML without a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/satellite-web" --no-save --ignore-scripts css-tree@3.1.0 parse5@7.2.1
          NODE_PATH="$RUNNER_TEMP/satellite-web/node_modules" node --test web/style.test.mjs
      - name: Vet
        run: go vet ./...
      - name: Install ACL tools for archive inheritance checks
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Test
        run: go test ./...
      - name: Race-check persistent orders and centre dispatch
        run: go test -race ./internal/state ./internal/downloadcoord ./internal/httpapi ./internal/central

  build:
    runs-on: ubuntu-latest
    needs: [test, postgres]
    permissions:
      contents: write
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build daemon and CLI
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/satellited ./cmd/satellited
          go build -trimpath -ldflags='-s -w' -o dist/satellite ./cmd/satellite
          cp deploy/verify-earthcare-archive.py dist/verify-earthcare-archive.py
          cp deploy/normalize-earthcare-packages.py dist/normalize-earthcare-packages.py
          cp deploy/systemd/earthcare-verification.service deploy/systemd/earthcare-verification.timer dist/
      - name: Record cloud build digests
        run: |
          cd dist
          sha256sum satellite satellited verify-earthcare-archive.py normalize-earthcare-packages.py earthcare-verification.service earthcare-verification.timer > SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-firefox@2ddc1281882c66dd6a359947714eed0a4b91afc1
        id: firefox
        with:
          firefox-version: 'latest-esr'
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ github.token }}
      - name: Check desktop and mobile layouts in cloud Firefox
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          npm install --prefix "$RUNNER_TEMP/satellite-visual" --no-save --ignore-scripts selenium-webdriver@4.35.0
          NODE_PATH="$RUNNER_TEMP/satellite-visual/node_modules" node web/visual-check.mjs
      - name: Publish and verify PR binaries
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="ci-pr-${PR_NUMBER}-${SOURCE_SHA:0:12}"
          gh release create "$tag" dist/satellite dist/satellited dist/verify-earthcare-archive.py dist/normalize-earthcare-packages.py dist/earthcare-verification.service dist/earthcare-verification.timer --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "CI PR ${PR_NUMBER} ${SOURCE_SHA:0:12}" \
            --notes "Cloud-verified PR binaries for $SOURCE_SHA" --prerelease
          gh release upload "$tag" dist/visual/*.png --repo "$GITHUB_REPOSITORY"
          mkdir -p verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verify
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .target_commitish)"
          [[ "$target" == "$SOURCE_SHA" ]]
          for name in satellite satellited verify-earthcare-archive.py normalize-earthcare-packages.py earthcare-verification.service earthcare-verification.timer; do
            cmp "dist/$name" "verify/$name"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name==\"$name\") | .digest")"
            [[ "$expected" == "sha256:$(sha256sum "verify/$name" | cut -d' ' -f1)" ]]
          done
      - name: Publish rolling CI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish-ci-release.sh
