name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check web JavaScript syntax
        run: node --check web/static/app.js
      - name: Check deployment scripts
        run: bash -n deploy/auto-deploy.sh deploy/activate-ci-release.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build daemon and CLI
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/satellited ./cmd/satellited
          go build -trimpath -ldflags='-s -w' -o dist/satellite ./cmd/satellite
      - name: Record cloud build digests
        run: |
          cd dist
          sha256sum satellite satellited > SHA256SUMS
      - name: Publish and verify PR binaries
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="ci-pr-${PR_NUMBER}-${SOURCE_SHA:0:12}"
          gh release create "$tag" dist/satellite dist/satellited --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "CI PR ${PR_NUMBER} ${SOURCE_SHA:0:12}" \
            --notes "Cloud-verified PR binaries for $SOURCE_SHA" --prerelease
          mkdir -p verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verify
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .target_commitish)"
          [[ "$target" == "$SOURCE_SHA" ]]
          for name in satellite satellited; do
            cmp "dist/$name" "verify/$name"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name==\"$name\") | .digest")"
            [[ "$expected" == "sha256:$(sha256sum "verify/$name" | cut -d' ' -f1)" ]]
          done
      - name: Publish rolling CI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish-ci-release.sh
      - name: Verify rolling release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Skipped verification of superseded main commit"
            exit 0
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/ci-latest")"
          [[ "$(jq -r .target_commitish <<<"$release")" == "$GITHUB_SHA" ]]
          mkdir verify
          gh release download ci-latest --repo "$GITHUB_REPOSITORY" --dir verify
          while IFS=$'\t' read -r name digest; do
            [[ "$name" =~ ^(satellite|satellited)(-prev[12]-[0-9a-f]{12})?$ ]]
            [[ "$digest" == "sha256:$(sha256sum "verify/$name" | cut -d' ' -f1)" ]]
          done < <(jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$release")
          cmp dist/satellite verify/satellite
          cmp dist/satellited verify/satellited
