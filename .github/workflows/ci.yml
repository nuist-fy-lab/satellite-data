name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check web JavaScript syntax
        run: |
          node --check web/static/app.js
          node --check web/static/login.js
          node --check web/static/catalog.js
          node --check web/static/era5-inventory.js
          node --check web/visual-check.mjs
      - name: Test request controls and timezones without a browser
        run: node --test web/era5.test.mjs web/download-timezones.test.mjs web/calendar-index.test.mjs web/catalog-inventory.test.mjs
      - name: Test historical EarthCARE verification controls
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Check historical verifier on production Python 3.6
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace python:3.6.15-slim python3 -m unittest discover -s deploy/tests -p 'test_verify_earthcare_archive.py'
      - name: Verify EarthCARE user units
        run: systemd-analyze verify deploy/systemd/earthcare-verification.service deploy/systemd/earthcare-verification.timer
      - name: Validate portal styles and HTML without a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/satellite-web" --no-save --ignore-scripts css-tree@3.1.0 parse5@7.2.1
          NODE_PATH="$RUNNER_TEMP/satellite-web/node_modules" node --test web/style.test.mjs
      - name: Vet
        run: go vet ./...
      - name: Install ACL tools for archive inheritance checks
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Test
        run: go test ./...
      - name: Race-check persistent orders and centre dispatch
        run: go test -race ./internal/state ./internal/downloadcoord ./internal/httpapi ./internal/central

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build daemon and CLI
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/satellited ./cmd/satellited
          go build -trimpath -ldflags='-s -w' -o dist/satellite ./cmd/satellite
          cp deploy/verify-earthcare-archive.py dist/verify-earthcare-archive.py
          cp deploy/normalize-earthcare-packages.py dist/normalize-earthcare-packages.py
          cp deploy/systemd/earthcare-verification.service deploy/systemd/earthcare-verification.timer dist/
      - name: Record cloud build digests
        run: |
          cd dist
          sha256sum satellite satellited verify-earthcare-archive.py normalize-earthcare-packages.py earthcare-verification.service earthcare-verification.timer > SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-firefox@2ddc1281882c66dd6a359947714eed0a4b91afc1
        id: firefox
        with:
          firefox-version: 'latest-esr'
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ github.token }}
      - name: Check desktop and mobile layouts in cloud Firefox
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          npm install --prefix "$RUNNER_TEMP/satellite-visual" --no-save --ignore-scripts selenium-webdriver@4.35.0
          NODE_PATH="$RUNNER_TEMP/satellite-visual/node_modules" node web/visual-check.mjs
      - name: Publish and verify PR binaries
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="ci-pr-${PR_NUMBER}-${SOURCE_SHA:0:12}"
          gh release create "$tag" dist/satellite dist/satellited dist/verify-earthcare-archive.py dist/normalize-earthcare-packages.py dist/earthcare-verification.service dist/earthcare-verification.timer --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "CI PR ${PR_NUMBER} ${SOURCE_SHA:0:12}" \
            --notes "Cloud-verified PR binaries for $SOURCE_SHA" --prerelease
          gh release upload "$tag" dist/visual/*.png --repo "$GITHUB_REPOSITORY"
          mkdir -p verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verify
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .target_commitish)"
          [[ "$target" == "$SOURCE_SHA" ]]
          for name in satellite satellited verify-earthcare-archive.py normalize-earthcare-packages.py earthcare-verification.service earthcare-verification.timer; do
            cmp "dist/$name" "verify/$name"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name==\"$name\") | .digest")"
            [[ "$expected" == "sha256:$(sha256sum "verify/$name" | cut -d' ' -f1)" ]]
          done
      - name: Publish rolling CI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish-ci-release.sh
