name: Actions storage retention

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest artifact per name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifacts_file="$(mktemp)"
          trap 'rm -f "$artifacts_file" "$caches_file"' EXIT

          gh api --paginate "/repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, (.id | tostring), ((.workflow_run.id // 0) | tostring)] | @tsv' \
            > "$artifacts_file"

          declare -A latest_artifact_id
          declare -A latest_run_id

          while IFS=$'\t' read -r name id run_id; do
            [[ -n "$name" ]] || continue
            if [[ -z "${latest_run_id[$name]+x}" ]] || (( run_id > latest_run_id[$name] )); then
              latest_run_id["$name"]="$run_id"
              latest_artifact_id["$name"]="$id"
            fi
          done < "$artifacts_file"

          while IFS=$'\t' read -r name id run_id; do
            [[ -n "$name" ]] || continue
            if [[ "$id" != "${latest_artifact_id[$name]}" ]]; then
              gh api --method DELETE "/repos/${REPO}/actions/artifacts/${id}"
            fi
          done < "$artifacts_file"

      - name: Keep only the most recently used Actions cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          caches_file="$(mktemp)"
          trap 'rm -f "$caches_file"' EXIT

          gh api --paginate "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [(.id | tostring), (.last_accessed_at // ""), .key] | @tsv' \
            > "$caches_file"

          [[ -s "$caches_file" ]] || exit 0

          latest_cache_id="$(
            sort -t $'\t' -k2,2r "$caches_file" | head -n 1 | cut -f 1
          )"

          while IFS=$'\t' read -r id last_accessed key; do
            [[ -n "$id" ]] || continue
            if [[ "$id" != "$latest_cache_id" ]]; then
              gh api --method DELETE "/repos/${REPO}/actions/caches/${id}"
            fi
          done < "$caches_file"

