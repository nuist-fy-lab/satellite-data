name: Release verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected ci-latest bundle SHA (blank accepts its published target)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check rolling release provenance, inherited inputs and all asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 deploy/ci/release.py verify --expected-sha "$EXPECTED_SHA"
